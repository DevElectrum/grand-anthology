name: EXP and Catch Multiplier Compatibility

on:
  pull_request:
    paths:
      - 'src/new_game.c'
      - 'src/option_menu.c'
      - 'src/battle_script_commands.c'
      - 'include/global.h'
      - 'include/qol_multipliers.h'
      - 'include/constants/global.h'
      - 'include/constants/vars.h'
      - 'test/overworld/ValidateQolMultipliers.py'
      - '.github/workflows/Qol-Multipliers.yml'
  push:
    branches: [main]
    paths:
      - 'src/new_game.c'
      - 'src/option_menu.c'
      - 'src/battle_script_commands.c'
      - 'include/global.h'
      - 'include/qol_multipliers.h'
      - 'include/constants/global.h'
      - 'include/constants/vars.h'
      - 'test/overworld/ValidateQolMultipliers.py'
      - '.github/workflows/Qol-Multipliers.yml'

permissions:
  contents: read

jobs:
  host-parity:
    name: Save compatibility and option math contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile option header against two-bit save mock
        run: python3 test/overworld/ValidateQolMultipliers.py

  gba:
    name: Compile actual optimized GBA game
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install original build tools
        timeout-minutes: 25
        run: |
          set -e
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libelf1 python3
      - name: Build game without publishing ROM
        shell: bash
        run: |
          set -o pipefail
          make release -j4 > "$RUNNER_TEMP/gba-build.log" 2>&1 || {
            grep -n -E 'Error:|error:|Error |undefined reference|collect2:|ld:|No rule to make target' "$RUNNER_TEMP/gba-build.log" | tail -n 100 || true
            tail -n 80 "$RUNNER_TEMP/gba-build.log"
            exit 1
          }
          test -s pokemonworld-release.gba
          echo "PASS: compiled optimized GBA game with extended multipliers"
