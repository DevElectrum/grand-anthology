name: A2 XGBA Collection Storage Contract
on:
  push:
    branches:
      - xgba/a2-collection-lab
    paths:
      - '.github/workflows/A2-XGBA-Collection.yml'
      - 'tools/xgba_a2_storage.py'
      - 'src/xgba_a2_journal.c'
      - 'src/xgba_a2_guest_bus.c'
      - 'src/xgba_a2_pager.c'
      - 'src/xgba_a2_fingerprint.c'
      - 'src/xgba_a2_cohort.c'
      - 'src/xgba_a2_transaction.c'
      - 'include/xgba_a2_transaction.h'
      - 'include/xgba_a2_cohort.h'
      - 'test/overworld/xgba_a2_cohort_harness.c'
      - 'include/xgba_a2_fingerprint.h'
      - 'test/overworld/xgba_a2_fingerprint_harness.c'
      - 'include/xgba_a2_pager.h'
      - 'include/xgba_a2_guest_bus.h'
      - 'include/xgba_a2_journal.h'
      - 'test/overworld/xgba_a2_journal_harness.c'
      - 'include/xgba_a2_storage_format.h'
      - 'test/overworld/test_xgba_a2_storage.py'
      - 'test/overworld/test_xgba_a2_transactions.py'
      - 'test/overworld/SavePatch.py'
      - 'test/save.c'
      - 'include/save.h'
      - 'include/constants/global.h'
      - 'include/pokemon_storage_system.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Flash and save schema pins
        run: python3 test/overworld/SavePatch.py --check
      - name: Validate A2 E6 layout and fail-closed migration
        run: python3 -m unittest discover -s test/overworld -p 'test_xgba_a2_*.py' -v
      - name: Compile and execute standalone A2 C journal corruption tests
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iinclude src/xgba_a2_journal.c src/xgba_a2_guest_bus.c src/xgba_a2_pager.c test/overworld/xgba_a2_journal_harness.c -o /tmp/xgba-a2-journal-test
          /tmp/xgba-a2-journal-test
      - name: Validate on-cartridge SHA-256 native-slot anchors
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iinclude src/xgba_a2_fingerprint.c test/overworld/xgba_a2_fingerprint_harness.c -o /tmp/xgba-a2-fingerprint-test
          /tmp/xgba-a2-fingerprint-test
      - name: Verify coherent native and extended PC save cohort selector
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iinclude src/xgba_a2_cohort.c src/xgba_a2_transaction.c src/xgba_a2_pager.c src/xgba_a2_journal.c src/xgba_a2_fingerprint.c test/overworld/xgba_a2_cohort_harness.c -o /tmp/xgba-a2-cohort-test
          /tmp/xgba-a2-cohort-test
      - name: Print storage geometry
        run: python3 tools/xgba_a2_storage.py layout


  native-a1-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native ARM7TDMI toolchain
        timeout-minutes: 20
        run: |
          set -e
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libelf1 python3
      - name: Verify whole Anthology ARM ROM still links under A1 budget
        shell: bash
        run: |
          set -o pipefail
          make xgba-a1 > /tmp/a2-rom.log 2>&1 || {
            grep -n -E 'Error:|error:|undefined reference|overflowed|ROM:|No rule|Traceback' /tmp/a2-rom.log | tail -n 100 || true
            tail -n 100 /tmp/a2-rom.log
            exit 1
          }
          tail -n 24 /tmp/a2-rom.log
          test "$(stat -c%s xgba-anthology-a1.gba)" -eq 268435456
      - name: Verify original A1 extended ROM and native-only Flash revision
        run: |
          python3 tools/xgba_a1_assets.py verify \
            --native xgba-anthology-a1-native-release.gba \
            --manifest build/xgba-a1-release/a1-manifest.json \
            --output xgba-anthology-a1.gba
          python3 tools/xgba_a1_assets.py check-symbols \
            --elf xgba-anthology-a1-native-release.elf \
            --manifest build/xgba-a1-release/a1-manifest.json
          python3 -c "f=open('xgba-anthology-a1.gba','rb'); f.seek(0xBC); assert f.read(1)==bytes([0]); f.close()"
      # No ROM binaries or user saves are uploaded.
