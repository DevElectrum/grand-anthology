# Public main branch: actual optimized GBA source build, then mGBA integration.
# The user intentionally published a WIP source repository; red mGBA is allowed.
# Test generated ROMs only in ephemeral runner space. No ROM/save artifacts.
name: P0 mGBA Release Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/P0-mGBA-Release-Smoke.yml"
      - "src/main_menu.c"
      - "src/unbound_start_menu.c"
      - "include/constants/unbound_start_menu.h"
      - "test/overworld/lua/WorldPlayerCheats.lua"
      - "test/overworld/lua/WorldShinyOdds.lua"
      - "test/overworld/lua/WorldFullPartyGift.lua"
      - "test/overworld/lua/WorldJohtoStarterBall.lua"
      - "test/overworld/lua/WorldKantoStarterBall.lua"
      - "test/overworld/lua/WorldBirchFullPCRefusal.lua"
      - "test/overworld/lua/WorldBirchStarterRescue.lua"
      - "src/option_menu.c"
      # Representative full-ROM regression whenever either P0 randomizer
      # channel, its player controls or save ABI changes. This deliberately
      # reuses broad game smoke tests, not dozens of story-NPC tests.
      - "src/script_pokemon_util.c"
      - "src/battle_setup.c"
      - "src/world_starter_randomizer.c"
      - "include/world_starter_randomizer.h"
      - "test/overworld/ValidateSeededGiftRandomizer.py"
      - "test/overworld/ValidateSeededStarterRandomizer.py"
      - "test/overworld/ValidateSeededStaticRandomizer.py"
      - "src/wild_encounter.c"
      # Static Pokémon source, encounter maps and fossil restoration must also
      # get a representative real-ROM/mGBA regression, not only source checks.
      - "data/maps/TinTower_2F/**"
      - "data/maps/DarkCave_NorthSide/**"
      - "data/maps/IcePath_B1F/**"
      - "data/maps/GraniteCave_StevensRoom/map.json"
      - "data/maps/GraniteCave_StevensRoom/scripts.inc"
      - "data/maps/ShoalCave_LowTideIceRoom/map.json"
      - "data/maps/ShoalCave_LowTideIceRoom/scripts.inc"
      - "data/maps/RustboroCity_DevonCorp_2F/scripts.inc"
      - "data/scripts/field_move_scripts.inc"
      - "src/data/anthology_rare_habitats.h"
      - "test/overworld/ValidateAnthologyHabitatRare.py"
      - "src/battle_main.c"
      - "src/debug.c"
      - "src/world_pc_search.c"
      - "include/world_pc_search.h"
      - "test/overworld/ValidateGlobalPcSearch.py"
      - "src/load_save.c"
      - "include/global.h"
      - "include/constants/global.h"
      - "test/overworld/ValidateSeededWildRandomizer.py"
      - "test/overworld/ValidateSeededTrainerRandomizer.py"
      - "src/region_switch.c"
      - "include/regions.h"
      - "data/maps/Route101/scripts.inc"
      - "test/overworld/ValidateFullPartyStarters.py"
      - "src/title_screen_world.c"
      - "test/overworld/GenLuaSymbols.py"
      - "test/overworld/lua/WorldFirstBoot.lua"
      - "test/overworld/lua/WorldRegionPartyTravel.lua"
      - "test/overworld/lua/WorldDiancieStatic.lua"
      # Kanto Route 5 now supplies two-parent breeding before the first
      # Champion, in addition to its separate classic one-mon caretaker.
      - "data/maps/Route5_PokemonDayCare_Frlg/map.json"
      - "data/maps/Route5_PokemonDayCare_Frlg/scripts.inc"
      - "data/maps/Route34_DayCare/scripts.inc"
      - "data/scripts/day_care_frlg.inc"
      - "src/daycare.c"
      - "test/overworld/ValidateAnthologyEvolutionAccess.py"
      - "test/overworld/lua/WorldKantoDaycare.lua"
  workflow_dispatch:

permissions:
  contents: read

# The 32 MiB GBA build + mGBA pass is expensive. A newer push supersedes an
# older branch snapshot; cancel stale smoke runs instead of building 6 revisions.
concurrency:
  group: p0-mgba-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Build and run GBA title in mGBA (no ROM uploads)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GBA and mGBA headless toolchains
        run: |
          set -eux
          # Ubuntu runner images sometimes include an inaccessible Microsoft
          # apt feed (HTTP 403). None of this GBA build uses that feed. Disable
          # only its runner-side source, leaving Ubuntu's official feeds intact.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libelf1 python3 cmake ninja-build liblua5.4-dev \
            zlib1g-dev pkg-config
      - name: Compile authentic optimized 32 MiB GBA game
        shell: bash
        run: |
          set -euo pipefail
          make release -j4 > "${RUNNER_TEMP}/game.log" 2>&1 || {
            grep -n -E 'Error:|error:|Error |undefined reference|overflowed|ROM:|No rule|collect2:|unknown opcode|invalid operands' "${RUNNER_TEMP}/game.log" | tail -n 140 || true
            tail -n 50 "${RUNNER_TEMP}/game.log"
            exit 1
          }
          test -s pokemonworld-release.gba
          size=$(wc -c < pokemonworld-release.gba)
          echo "ROM bytes: $size / 33554432"
          test "$size" -le 33554432
          # Do not upload or publish ROM images, saves, or screenshots.
      - name: Build deterministic Lua-capable mGBA headless
        shell: bash
        run: |
          set -euo pipefail
          git init "${RUNNER_TEMP}/mgba"
          git -C "${RUNNER_TEMP}/mgba" remote add origin https://github.com/mgba-emu/mgba.git
          # Exact source revision already exercised by this repo's existing
          # test/overworld/mgba/README.md testing notes.
          git -C "${RUNNER_TEMP}/mgba" fetch --depth=1 origin 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C "${RUNNER_TEMP}/mgba" checkout --detach FETCH_HEAD
          git -C "${RUNNER_TEMP}/mgba" apply "${GITHUB_WORKSPACE}/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch"
          cmake -S "${RUNNER_TEMP}/mgba" -B "${RUNNER_TEMP}/mgba/build" -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF \
            -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build "${RUNNER_TEMP}/mgba/build" --target mgba-headless -j4
          test -x "${RUNNER_TEMP}/mgba/build/mgba-headless"
      - name: Real mGBA GBA title and VRAM regression suite
        shell: bash
        run: |
          set -euo pipefail
          export MGBA_HEADLESS="${RUNNER_TEMP}/mgba/build/mgba-headless"
          export PW_TITLE_SYMBOLS="${RUNNER_TEMP}/p0-title-symbols.lua"
          export PW_OUT="${RUNNER_TEMP}/p0-mgba-tests"
          export PW_TIMEOUT=360
          echo "Retained optimized-release title/menu symbols:"
          arm-none-eabi-nm --defined-only pokemonworld-release.elf | grep -E 'WorldTitleScreen|CB2_MainMenu|CB2_InitClearSave|CB2_Overworld' || true
          python3 test/overworld/GenLuaSymbols.py pokemonworld-release.elf arm-none-eabi-nm --title > "$PW_TITLE_SYMBOLS"
          test -s "$PW_TITLE_SYMBOLS"
          # Test runner only emulates a disposable temporary copy and never
          # accesses a user's real save. WorldTitle verifies actual VRAM bytes.
          test/overworld/mgba-run.sh test/overworld/lua/WorldTitle.lua pokemonworld-release.gba
          grep -q 'VERDICT WorldTitle: .* PASS' "$PW_OUT/WorldTitle.log" || {
            echo 'mGBA title suite did not produce a clean PASS verdict'
            ls -la "$PW_OUT" || true
            exit 1
          }
          echo 'PASS: authentic GBA title/graphics/input tested in mGBA'
          # The production graphical Start wheel must expose the safe Cheats UI
          # even when developer debug is disabled in RELEASE=1 builds.
          test/overworld/mgba-run.sh test/overworld/lua/WorldPlayerCheats.lua pokemonworld-release.gba
          grep -q 'VERDICT WorldPlayerCheats: 8/8 PASS' "$PW_OUT/WorldPlayerCheats.log"
          test -f "$PW_OUT/WorldPlayerCheats.PASS"
          echo 'PASS: release graphical Start opens Cheats and Quick Pokémon creates a real party member'
          # Cross-campaign party continuity must also handle a seventh gift
          # when the party is full: real ScriptGiveMon -> global PC, then flash
          # Save/core reset/Continue restores the box AND original six mons.
          test/overworld/mgba-run.sh test/overworld/lua/WorldFullPartyGift.lua pokemonworld-release.gba
          grep -q 'VERDICT WorldFullPartyGift: 15/15 PASS' "$PW_OUT/WorldFullPartyGift.log" || {
            tail -n 110 "$PW_OUT/WorldFullPartyGift.log" || true
            exit 1
          }
          test -f "$PW_OUT/WorldFullPartyGift.PASS"
          echo 'PASS: full-party seventh gift is globally boxed and survives flash Save/Continue'
          # Independently run BOTH original-region starter scenes. A test
          # navigation failure must not prevent the other region from running:
          # rebuilding this 32 MiB cartridge takes longer than either test.
          # Require every strict scene verdict and PASS sentinel; aggregate
          # failures so CI remains red if even one real story scene is broken.
          starter_failed=0
          if ! test/overworld/mgba-run.sh test/overworld/lua/WorldJohtoStarterBall.lua pokemonworld-release.gba; then
            starter_failed=1
          fi
          if grep -q 'VERDICT WorldJohtoStarterBall: 34/34 PASS' "$PW_OUT/WorldJohtoStarterBall.log" &&
              test -f "$PW_OUT/WorldJohtoStarterBall.PASS"; then
            echo 'PASS: original Elm Chikorita boxes seventh Pokémon and Save/Continue preserves it'
          else
            echo 'FAIL: Johto Elm starter-ball scene'
            tail -n 105 "$PW_OUT/WorldJohtoStarterBall.log" || true
            starter_failed=1
          fi
          if ! test/overworld/mgba-run.sh test/overworld/lua/WorldKantoStarterBall.lua pokemonworld-release.gba; then
            starter_failed=1
          fi
          if grep -q 'VERDICT WorldKantoStarterBall: 34/34 PASS' "$PW_OUT/WorldKantoStarterBall.log" &&
              test -f "$PW_OUT/WorldKantoStarterBall.PASS"; then
            echo 'PASS: original Oak Bulbasaur boxes seventh Pokémon and Save/Continue preserves it'
          else
            echo 'FAIL: Kanto Oak starter-ball scene'
            tail -n 125 "$PW_OUT/WorldKantoStarterBall.log" || true
            starter_failed=1
          fi
          # Run Birch independently, including when Oak or Elm fails, to avoid
          # hiding a separate Hoenn rescue/PC-full quest regression.
          if ! test/overworld/mgba-run.sh test/overworld/lua/WorldBirchFullPCRefusal.lua pokemonworld-release.gba; then
            starter_failed=1
          fi
          if grep -q 'VERDICT WorldBirchFullPCRefusal: 26/26 PASS' "$PW_OUT/WorldBirchFullPCRefusal.log" &&
              test -f "$PW_OUT/WorldBirchFullPCRefusal.PASS"; then
            echo 'PASS: real Birch rescue bag refuses full six-party / 420-PC storage without consuming quest flags'
          else
            echo 'FAIL: original Hoenn Route 101 full-storage refusal scene'
            tail -n 130 "$PW_OUT/WorldBirchFullPCRefusal.log" || true
            starter_failed=1
          fi
          # Extended original Birch scene stays available as a manual
          # workflow_dispatch regression. User's feature-first P0 plan:
          # don't block unrelated production feature pushes on every NPC scene.
          # This suite was most recently 32/33 through the real battle/lab,
          # but lab-dialogue settling and Save/Continue are still unresolved.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Independent positive branch: native Birch bag, real Treecko
            # choice, original Zigzagoon rescue battle, shared-PC overflow,
            # and unchanged save-version/data across battery flash Continue.
            if ! test/overworld/mgba-run.sh test/overworld/lua/WorldBirchStarterRescue.lua pokemonworld-release.gba; then
              starter_failed=1
            fi
            if grep -q 'VERDICT WorldBirchStarterRescue: 46/46 PASS' "$PW_OUT/WorldBirchStarterRescue.log" &&
                test -f "$PW_OUT/WorldBirchStarterRescue.PASS"; then
              echo 'PASS: original Birch Treecko full-party successful rescue battle and Save/Continue'
            else
              echo 'FAIL: original Hoenn Route 101 positive starter/battle/save scene'
              tail -n 160 "$PW_OUT/WorldBirchStarterRescue.log" || true
              starter_failed=1
            fi
          else
            echo 'SKIP: optional original Birch positive scene is manual extended regression; not claimed 46/46'
          fi
          if [ "$starter_failed" -ne 0 ]; then
            echo 'FAIL: at least one original regional starter/rescue gameplay suite failed'
            exit 1
          fi
          # Real user selection: legacy odds -> Always, Save, reset, Continue.
          test/overworld/mgba-run.sh test/overworld/lua/WorldShinyOdds.lua pokemonworld-release.gba
          grep -q 'VERDICT WorldShinyOdds: 26/26 PASS' "$PW_OUT/WorldShinyOdds.log"
          test -f "$PW_OUT/WorldShinyOdds.PASS"
          echo 'PASS: all eleven Shiny Odds options retained; Always, 1/2, 1/4, 1/8 survive real battery Save/Continue'
          # A separate disposable new-game invocation, still no save fixture.
          # This reaches actual GBA overworld logic, not merely its title UI.
          test/overworld/mgba-run.sh test/overworld/lua/WorldFirstBoot.lua pokemonworld-release.gba
          grep -q 'VERDICT WorldFirstBoot: 4/4 PASS' "$PW_OUT/WorldFirstBoot.log" || {
            echo 'fresh-game overworld smoke did not report all four passes'
            test -f "$PW_OUT/WorldFirstBoot.log" && tail -n 100 "$PW_OUT/WorldFirstBoot.log" || true
            exit 1
          }
          echo 'PASS: fresh full-roster new game reaches shared Region Hub with empty party'
          # Full-party travel: real region attendant scripts and actual Hub Pass,
          # with a six-Pokémon scratch fixture isolated to emulator RAM.
          test/overworld/mgba-run.sh test/overworld/lua/WorldRegionPartyTravel.lua pokemonworld-release.gba
          grep -q 'VERDICT WorldRegionPartyTravel: .* PASS' "$PW_OUT/WorldRegionPartyTravel.log" || {
            echo 'full-party cross-region integration smoke did not pass'
            test -f "$PW_OUT/WorldRegionPartyTravel.log" && tail -n 120 "$PW_OUT/WorldRegionPartyTravel.log" || true
            exit 1
          }
          test -f "$PW_OUT/WorldRegionPartyTravel.PASS"
          # All three regions must appear in the log; no partial early-break PASS.
          for region in Kanto Johto Hoenn; do
            grep -q "$region roundtrip retains byte-identical 6-slot party" "$PW_OUT/WorldRegionPartyTravel.log"
          done
          echo 'PASS: all three actual world gates retain full six-mon party and return'
          # The same suite also confirms actual Start/Save, mGBA reset,
          # Continue, six encrypted party structs, held item, Hub Pass and
          # active Hoenn campaign. The PASS sentinel rejects partial work.
          for assertion in \
            'save/restart restores all six unmodified 100-byte Pokemon' \
            'save/restart retains Hoenn as persisted active campaign' \
            'save/restart retains usable Hub Pass key item' \
            'save/restart stamps latest supported save format'; do
            grep -q "$assertion" "$PW_OUT/WorldRegionPartyTravel.log"
          done
          echo 'PASS: real GBA save/core reset/Continue retains all six Pokemon and campaign state'

          # Keep the late P0 acceptance probes independent. A new failure
          # in one smoke must not hide the known Diancie navigational status
          # or waste a complete optimized ROM build and emulator setup.
          qa_failed=0

          # Route 5 actors must spawn from a REAL exterior-to-interior warp.
          # This validates object placement and dialogue only, not Egg output.
          if test/overworld/mgba-run.sh test/overworld/lua/WorldKantoDaycare.lua pokemonworld-release.gba \
            && grep -q 'VERDICT WorldKantoDaycare: .* PASS' "$PW_OUT/WorldKantoDaycare.log" \
            && test -f "$PW_OUT/WorldKantoDaycare.PASS"; then
            echo 'PASS: Kanto Route 5 breeding NPCs load via door and respond (not Egg acceptance)'
          else
            echo 'FAIL: Kanto Route 5 field/interaction smoke'
            test -f "$PW_OUT/WorldKantoDaycare.log" && tail -n 100 "$PW_OUT/WorldKantoDaycare.log" || true
            qa_failed=1
          fi

          # The Diancie fixture must reach the real StevensRoom map before
          # its visible object or battle result can be attributed to gameplay.
          if test/overworld/mgba-run.sh test/overworld/lua/WorldDiancieStatic.lua pokemonworld-release.gba \
            && grep -q 'VERDICT WorldDiancieStatic: .* PASS' "$PW_OUT/WorldDiancieStatic.log" \
            && test -f "$PW_OUT/WorldDiancieStatic.PASS" \
            && grep -q 'Diancie is visible after Steven letter and two badges before Champion' "$PW_OUT/WorldDiancieStatic.log" \
            && grep -q 'the real scripted Diancie battle opened' "$PW_OUT/WorldDiancieStatic.log" \
            && grep -q 'opposing battle Pokemon is Diancie' "$PW_OUT/WorldDiancieStatic.log"; then
            echo 'PASS: Diancie actual scripted object launches species-correct battle'
          else
            echo 'FAIL: Diancie fixture/overworld/battle start remains unverified'
            test -f "$PW_OUT/WorldDiancieStatic.log" && tail -n 150 "$PW_OUT/WorldDiancieStatic.log" || true
            qa_failed=1
          fi
          if (( qa_failed != 0 )); then
            echo 'FAIL: One or more independent late P0 mGBA acceptance probes failed'
            exit 1
          fi
          # No upload-artifact step, no ROM, .sav or screenshots persisted.
