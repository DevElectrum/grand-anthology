name: Website build

on:
  push:
    paths:
      - 'website/**'
      - 'data/catalog/**'
      - 'data/maps/map_groups.json'
      - 'src/data/wild_encounters.json'
      - 'src/data/anthology_extra_habitats.h'
      - 'src/data/anthology_aquatic_habitats.h'
      - 'src/data/anthology_rare_habitats.h'
      - 'src/world_starter_randomizer.c'
      - 'src/wild_encounter.c'
      - 'src/script_pokemon_util.c'
      - 'src/starter_choose.c'
      - 'include/wild_encounter.h'
      - 'include/constants/maps.h'
      - 'include/constants/species.h'
      - 'graphics/pokemon/**'
      - 'src/data/pokemon/species_info/**'
      - 'src/data/pokemon/form_species_tables.h'
      - 'src/data/abilities.h'
      - 'include/constants/species.h'
      - 'include/constants/pokedex.h'
      - 'include/constants/pokemon.h'
      - 'include/config/**'
      - '.github/workflows/Website-Build.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'data/catalog/**'
      - 'data/maps/map_groups.json'
      - 'src/data/wild_encounters.json'
      - 'src/data/anthology_extra_habitats.h'
      - 'src/data/anthology_aquatic_habitats.h'
      - 'src/data/anthology_rare_habitats.h'
      - 'src/world_starter_randomizer.c'
      - 'src/wild_encounter.c'
      - 'src/script_pokemon_util.c'
      - 'src/starter_choose.c'
      - 'include/wild_encounter.h'
      - 'include/constants/maps.h'
      - 'include/constants/species.h'
      - 'graphics/pokemon/**'
      - 'src/data/pokemon/species_info/**'
      - 'src/data/pokemon/form_species_tables.h'
      - 'src/data/abilities.h'
      - 'include/constants/species.h'
      - 'include/constants/pokedex.h'
      - 'include/constants/pokemon.h'
      - 'include/config/**'
      - '.github/workflows/Website-Build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure C preprocessor and Python are available
        run: |
          gcc --version
          python3 --version
      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Check compiled game C legendary permutations against independent v1/v2 reference
        run: python3 test/overworld/ValidateLegendaryShufflePermutation.py
      - name: Check catalog presentation and distinct encounter methods
        working-directory: website
        run: npm test
      - name: Generate website and static pages
        working-directory: website
        run: npm run build
      - name: Check expected output
        run: |
          test -f website/dist/index.html
          test -f website/dist/pokedex/1/index.html
          grep -q 'pokemon-sprites/bulbasaur/' website/dist/pokedex/1/index.html
          grep -q 'pokemon-sprites/charizard/mega_x/' website/dist/pokedex/6/index.html
          grep -q 'pokemon-sprites/terapagos/stellar/' website/dist/pokedex/1024/index.html
          grep -q 'data-sprite-form="SPECIES_ZYGARDE_COMPLETE"' website/dist/pokedex/718/index.html
          test -f website/dist/pokemon-sprites/bulbasaur/icon.png
          test -f website/dist/pokedex/133/index.html
          test -f website/dist/pokedex/349/index.html
          grep -q 'id="theme-toggle"' website/dist/index.html
          grep -q 'id="theme-toggle"' website/dist/pokedex/133/index.html
          grep -q 'Old Rod:' website/dist/pokedex/349/index.html
          ! grep -q 'Level not indexed' website/dist/pokedex/133/index.html
          test -f website/dist/pokedex/1025/index.html
          test -f website/dist/randomizer/index.html
          grep -q 'id="atlas-seed"' website/dist/randomizer/index.html
          grep -q 'id="atlas-view"' website/dist/randomizer/index.html
          grep -q 'id="atlas-statics"' website/dist/randomizer/index.html
          grep -q 'id="atlas-static-mode"' website/dist/randomizer/index.html
          grep -q 'id="atlas-static-version"' website/dist/randomizer/index.html
          grep -q 'value="statics"' website/dist/randomizer/index.html
          test -f website/dist/mega-stones/index.html
