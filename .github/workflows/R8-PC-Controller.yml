name: R8.4 C3C genuine controller entry into both PC frontends
on:
  push:
    branches:
      - xgba/a2-collection-lab
    paths:
      - '.github/workflows/R8-PC-Controller.yml'
      - 'tools/xgba_r8_pc_controller.lua'
      - 'tools/xgba_a2_symbol_env.py'
      - 'src/pokemon_storage_system.c'
      - 'src/swsh_storage_system.c'
      - 'src/xgba_r8_runtime_test.c'
      - 'src/field_specials.c'
      - 'include/xgba_r8_runtime_test.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-controller-pc-entry:
    strategy:
      fail-fast: false
      matrix:
        pc: [swsh, classic]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      A2_E6_SAVE_PATH: build/r8-ci/test.sav
      R8_PC_ENGINE: ${{ matrix.pc }}
      A2_ACTION: save
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DevElectrum/xgba
          ref: 4e0f59185e2c7d7ed5333d8adc20e8d3ad94d05c
          path: build/r8-ci/xgba
          persist-credentials: false
      - name: Select frontend in disposable CI checkout only
        run: |
          if [ "${{ matrix.pc }}" = "classic" ]; then
            grep -qx '#define SWSH_STORAGE_SYSTEM TRUE' include/swsh_storage_system.h
            sed -i 's/^#define SWSH_STORAGE_SYSTEM TRUE$/#define SWSH_STORAGE_SYSTEM FALSE/' include/swsh_storage_system.h
            grep -qx '#define SWSH_STORAGE_SYSTEM FALSE' include/swsh_storage_system.h
          else
            grep -qx '#define SWSH_STORAGE_SYSTEM TRUE' include/swsh_storage_system.h
          fi
      - name: Install ARM and pinned XGBA headless toolchains
        run: |
          set -e
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q packages.microsoft.com "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libelf1 python3 build-essential cmake ninja-build \
            pkg-config zlib1g-dev libcmocka-dev libsdl2-dev liblua5.4-dev
      - name: C3 source guards
        run: python3 test/overworld/test_xgba_r8_pc_chooser.py
      - name: Build disposable instrumented game
        run: |
          set -e
          make release -j4 XGBA_A1=1 XGBA_A2=1 XGBA_R8=1 XGBA_R8_TEST=1 \
            BUILD_NAME=xgba-r8-test FILE_NAME=xgba-anthology-r8-test-native-release
          python3 tools/xgba_a2_symbol_env.py xgba-anthology-r8-test-native-release.elf --github-env "$GITHUB_ENV"
      - name: Build disposable R8 ROM and blank E6 sidecar
        run: |
          set -e
          mkdir -p build/r8-ci
          python3 tools/xgba_a1_assets.py pack \
            --native xgba-anthology-r8-test-native-release.gba \
            --manifest build/xgba-r8-test-release/a1-manifest.json \
            --output build/r8-ci/layout.gba
          python3 tools/xgba_a2_rom.py tag --r8 build/r8-ci/layout.gba build/r8-ci/test.gba
          python3 tools/xgba_a2_rom.py verify --r8 build/r8-ci/test.gba
          python3 tools/xgba_a2_storage.py blank build/r8-ci/test.sav
          python3 tools/xgba_a2_storage.py audit-blank build/r8-ci/test.sav
      - name: Build pinned XGBA real headless emulator
        run: |
          cmake -S build/r8-ci/xgba -B build/r8-ci/runner -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DM_CORE_GBA=ON -DM_CORE_GB=OFF \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_HEADLESS=ON \
            -DBUILD_SUITE=OFF -DENABLE_SCRIPTING=ON -DUSE_LUA=5.4 \
            -DUSE_JSON_C=OFF -DUSE_FFMPEG=OFF -DUSE_EDITLINE=OFF
          cmake --build build/r8-ci/runner --target mgba-headless --parallel 2
      - name: Perform audited actual Save1
        run: |
          set -e
          timeout --signal=INT --kill-after=5s 360s \
            build/r8-ci/runner/mgba-headless \
            --script tools/xgba_a2_bind_save.lua \
            --script tools/xgba_a2_runtime_save.lua \
            build/r8-ci/test.gba > /tmp/r8-pc-save1.log 2>&1 || {
              tail -n 110 /tmp/r8-pc-save1.log
              exit 1
            }
          grep -q 'A2_XGBA_SAVE_INPUT_SEQUENCE_FINISHED_AUDIT_REQUIRED' /tmp/r8-pc-save1.log
          python3 tools/xgba_a2_storage.py audit build/r8-ci/test.sav | tee /tmp/r8-pc-before.txt
          grep -q '^counter: 1$' /tmp/r8-pc-before.txt
      - name: Walk to real Region Hub PC and enter graphical storage with controller
        run: |
          set -e
          test -n "$A2_R8_PC_UI_TRACE"
          timeout --signal=INT --kill-after=5s 360s \
            build/r8-ci/runner/mgba-headless \
            --script tools/xgba_a2_bind_save.lua \
            --script tools/xgba_r8_pc_controller.lua \
            build/r8-ci/test.gba > /tmp/r8-pc-controller.log 2>&1 || {
              grep -E 'R8_PC_CONTROLLER_|A2_XGBA_E6_SAVE_BOUND' /tmp/r8-pc-controller.log | tail -n 100 || true
              tail -n 30 /tmp/r8-pc-controller.log
              exit 1
            }
          grep -q 'R8_PC_CONTROLLER_SMOKE_PASS genuine_pc_ui_active=1' /tmp/r8-pc-controller.log
          python3 tools/xgba_a2_storage.py audit build/r8-ci/test.sav | tee /tmp/r8-pc-after.txt
          diff -u /tmp/r8-pc-before.txt /tmp/r8-pc-after.txt
      - name: Real Jump chooser preview R/L and cancel without persistence mutation
        env:
          R8_PC_ACTION: preview-cancel
        run: |
          set -e
          test -n "$A2_R8_PC_CHOOSER_TRACE"
          timeout --signal=INT --kill-after=5s 360s \
            build/r8-ci/runner/mgba-headless \
            --script tools/xgba_a2_bind_save.lua \
            --script tools/xgba_r8_pc_controller.lua \
            build/r8-ci/test.gba > /tmp/r8-pc-preview.log 2>&1 || {
              grep -E 'R8_PC_CONTROLLER_|A2_XGBA_E6_SAVE_BOUND' /tmp/r8-pc-preview.log | tail -n 100 || true
              tail -n 30 /tmp/r8-pc-preview.log
              exit 1
            }
          grep -q 'R8_PC_CONTROLLER_PREVIEW_CANCEL_PASS active_page=0 box=0' /tmp/r8-pc-preview.log
          python3 tools/xgba_a2_storage.py audit build/r8-ci/test.sav | tee /tmp/r8-pc-preview-audit.txt
          diff -u /tmp/r8-pc-before.txt /tmp/r8-pc-preview-audit.txt
      - name: Controller Jump commits remote Box 15 and reopens correct resident page
        env:
          R8_PC_ACTION: jump-commit
        run: |
          set -e
          test -n "$A2_R8_PC_CHOOSER_TRACE"
          timeout --signal=INT --kill-after=5s 360s \
            build/r8-ci/runner/mgba-headless \
            --script tools/xgba_a2_bind_save.lua \
            --script tools/xgba_r8_pc_controller.lua \
            build/r8-ci/test.gba > /tmp/r8-pc-jump.log 2>&1 || {
              grep -E 'R8_PC_CONTROLLER_|A2_XGBA_E6_SAVE_BOUND' /tmp/r8-pc-jump.log | tail -n 100 || true
              tail -n 30 /tmp/r8-pc-jump.log
              exit 1
            }
          grep -q 'R8_PC_CONTROLLER_JUMP_COMMIT_PASS global_box=15 resident_page=1 local_box=0' /tmp/r8-pc-jump.log
          python3 tools/xgba_a2_storage.py audit build/r8-ci/test.sav | tee /tmp/r8-pc-jump-audit.txt
          diff -u /tmp/r8-pc-before.txt /tmp/r8-pc-jump-audit.txt
      - name: Real populated Save2 and independent storage audit
        env:
          A2_ACTION: save-again
          A2_EXPECTED_SAVE_COUNTER: '1'
        run: |
          set -e
          timeout --signal=INT --kill-after=5s 360s \
            build/r8-ci/runner/mgba-headless \
            --script tools/xgba_a2_bind_save.lua \
            --script tools/xgba_a2_runtime_save.lua \
            build/r8-ci/test.gba > /tmp/r8-pc-save2.log 2>&1 || {
              grep -E 'A2_XGBA_(DIAG|GAME_SAVE|JOURNAL)' /tmp/r8-pc-save2.log | tail -n 100 || true
              tail -n 25 /tmp/r8-pc-save2.log
              exit 1
            }
          grep -q 'A2_XGBA_SAVE_INPUT_SEQUENCE_FINISHED_AUDIT_REQUIRED' /tmp/r8-pc-save2.log
          python3 tools/xgba_a2_storage.py audit build/r8-ci/test.sav | tee /tmp/r8-pc-save2-audit.txt
          grep -q '^counter: 2$' /tmp/r8-pc-save2-audit.txt
      - name: Controller Jump from Box30 to Box15 and actual Save3
        env:
          R8_PC_ACTION: jump-save
        run: |
          set -e
          test -n "$A2_R8_PC_CHOOSER_TRACE"
          test -n "$A2_SAVE_COUNTER"
          test -n "$A2_USM_STATE_PTR"
          timeout --signal=INT --kill-after=5s 360s \
            build/r8-ci/runner/mgba-headless \
            --script tools/xgba_a2_bind_save.lua \
            --script tools/xgba_r8_pc_controller.lua \
            build/r8-ci/test.gba > /tmp/r8-pc-save3.log 2>&1 || {
              grep -E 'R8_PC_CONTROLLER_|A2_XGBA_E6_SAVE_BOUND' /tmp/r8-pc-save3.log | tail -n 130 || true
              tail -n 25 /tmp/r8-pc-save3.log
              exit 1
            }
          grep -q 'R8_PC_CONTROLLER_JUMP_SAVE3_PASS global_box=15 counter=3' /tmp/r8-pc-save3.log
          grep -q 'R8_PC_CONTROLLER_REAL_SAVE3_COMMITTED counter=3 stage=8' /tmp/r8-pc-save3.log
          python3 tools/xgba_a2_storage.py audit build/r8-ci/test.sav | tee /tmp/r8-pc-save3-audit.txt
          grep -q '^counter: 3$' /tmp/r8-pc-save3-audit.txt
          # Audit resolves the entire committed eight-page cohort, not a
          # guessed active-page buffer. No 80-byte BoxPokemon may change.
          grep '^collection_boxes_sha256:' /tmp/r8-pc-save2-audit.txt > /tmp/r8-pc-boxes-save2.txt
          grep '^collection_boxes_sha256:' /tmp/r8-pc-save3-audit.txt > /tmp/r8-pc-boxes-save3.txt
          test -s /tmp/r8-pc-boxes-save2.txt
          test -s /tmp/r8-pc-boxes-save3.txt
          diff -u /tmp/r8-pc-boxes-save2.txt /tmp/r8-pc-boxes-save3.txt
      - name: Cold Continue rejects missing records and wrong Box15 selection
        env:
          A2_ACTION: resume
          A2_EXPECTED_SAVE_COUNTER: '3'
        run: |
          set -e
          timeout --signal=INT --kill-after=5s 360s \
            build/r8-ci/runner/mgba-headless \
            --script tools/xgba_a2_bind_save.lua \
            --script tools/xgba_a2_runtime_save.lua \
            build/r8-ci/test.gba > /tmp/r8-pc-cold3.log 2>&1 || {
              grep -E 'A2_XGBA_(COLD|DIAG|GAME_SAVE)' /tmp/r8-pc-cold3.log | tail -n 100 || true
              tail -n 25 /tmp/r8-pc-cold3.log
              exit 1
            }
          grep -q 'A2_XGBA_COLD_RESUME_HUB_PASS counter=3' /tmp/r8-pc-cold3.log
          python3 tools/xgba_a2_storage.py audit build/r8-ci/test.sav | tee /tmp/r8-pc-cold3-audit.txt
          diff -u /tmp/r8-pc-save3-audit.txt /tmp/r8-pc-cold3-audit.txt
      - name: Delete disposable ROM and save on success or failure
        if: always()
        run: |
          rm -f build/r8-ci/layout.gba build/r8-ci/test.gba build/r8-ci/test.sav
          echo 'No gameplay ROM or save published.'
