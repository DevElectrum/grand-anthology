name: A2 XGBA disposable boot probe

on:
  push:
    branches:
      - xgba/a2-collection-lab
    paths:
      - '.github/workflows/A2-XGBA-Boot-Probe.yml'
      - 'src/save.c'
      - 'src/unbound_start_menu.c'
      - 'src/save_failed_screen.c'
      - 'src/trade.c'
      - 'src/new_game.c'
      - 'src/main.c'
      - 'src/xgba_a2_*.c'
      - 'include/xgba_a2_*.h'
      - 'tools/xgba_a2_storage.py'
      - 'tools/xgba_a2_runtime_boot.lua'
      - 'tools/xgba_a2_runtime_save.lua'
      - 'tools/xgba_a2_symbol_env.py'
      - 'tools/xgba_a2_rom.py'
      - 'tools/xgba_a1_assets.py'
      - 'Makefile'
      - 'tools/xgba_select_map_layout.py'
      - 'map_data_rules.mk'
      - 'data/maps.s'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anthology-a2-xgba-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-xgba-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out only experimental Anthology source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out frozen XGBA E7 source without modifying it
        uses: actions/checkout@v4
        with:
          repository: DevElectrum/xgba
          ref: 9aa5e11e08274e5df09379be8f088e7e6db8f139
          path: build/a2-ci-xgba-src
          persist-credentials: false

      - name: Install GBA toolchain and headless XGBA dependencies
        shell: bash
        run: |
          set -e
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libelf1 python3 build-essential cmake ninja-build \
            pkg-config zlib1g-dev libcmocka-dev libsdl2-dev liblua5.4-dev

      - name: Build isolated A2 ARM game
        shell: bash
        run: |
          set -euo pipefail
          make release -j4 XGBA_A1=1 XGBA_A2=1 BUILD_NAME=xgba-a2 \
            FILE_NAME=xgba-anthology-a2-native-release > /tmp/a2-boot-build.log 2>&1 || {
            grep -n -E 'error:|undefined reference|overflowed|Error:|collect2:' /tmp/a2-boot-build.log | tail -n 80 || true
            tail -n 90 /tmp/a2-boot-build.log
            exit 1
          }
          test -s xgba-anthology-a2-native-release.elf
          test -s build/xgba-a2-release/a1-manifest.json
          tail -n 20 /tmp/a2-boot-build.log

      - name: Create temporary E6 ROM and empty disposable E6 save
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a2-ci-runtime
          python3 tools/xgba_a1_assets.py pack \
            --native xgba-anthology-a2-native-release.gba \
            --manifest build/xgba-a2-release/a1-manifest.json \
            --output build/a2-ci-runtime/a2-layout.gba
          python3 tools/xgba_a2_rom.py tag \
            build/a2-ci-runtime/a2-layout.gba build/a2-ci-runtime/a2-boot.gba
          python3 tools/xgba_a2_rom.py verify build/a2-ci-runtime/a2-boot.gba
          python3 tools/xgba_a2_storage.py blank build/a2-ci-runtime/a2-boot.sav
          python3 tools/xgba_a2_storage.py audit-blank build/a2-ci-runtime/a2-boot.sav
          test "$(stat -c%s build/a2-ci-runtime/a2-boot.gba)" -eq 268435456
          test "$(stat -c%s build/a2-ci-runtime/a2-boot.sav)" -eq 16777216

      - name: Compile frozen XGBA headless runner
        shell: bash
        run: |
          set -euo pipefail
          cmake -S build/a2-ci-xgba-src -B build/a2-ci-xgba-runner -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DM_CORE_GBA=ON -DM_CORE_GB=OFF \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF \
            -DBUILD_HEADLESS=ON -DBUILD_SUITE=OFF \
            -DENABLE_SCRIPTING=ON -DUSE_LUA=5.4 -DUSE_JSON_C=OFF -DUSE_FFMPEG=OFF \
            -DUSE_EDITLINE=OFF -DUSE_DISCORD_RPC=OFF
          cmake --build build/a2-ci-xgba-runner --target mgba-headless --parallel 2
          test -x build/a2-ci-xgba-runner/mgba-headless

      - name: Prove E6-tagged Anthology stays executing in real XGBA core
        shell: bash
        run: |
          set -uo pipefail
          # This is a bounded, noninteractive BOOT probe. It is NOT a claim
          # that New Game was navigated or an in-game save was verified.
          # -S 255 prevents the normal software shutdown SWI from ending
          # the test before the deliberate timer interrupt.
          # GNU timeout returns 124 upon its deliberate timer expiration.
          # GitHub's shell is -e by default, so temporarily allow that status
          # long enough to classify it instead of incorrectly failing the job.
          set +e
          timeout --signal=INT --kill-after=5s 20s \
            build/a2-ci-xgba-runner/mgba-headless -S 255 \
            build/a2-ci-runtime/a2-boot.gba > /tmp/a2-xgba-boot.log 2>&1
          result=$?
          set -e
          tail -n 100 /tmp/a2-xgba-boot.log
          if [ "$result" -ne 124 ]; then
            echo "XGBA exited early or did not survive the bounded runtime. Exit: $result"
            exit 1
          fi
          echo "Real XGBA headless process survived 20 seconds of execution."
          python3 tools/xgba_a2_storage.py audit-blank build/a2-ci-runtime/a2-boot.sav

      - name: Bind real linked A2 game symbols for Lua
        run: |
          python3 tools/xgba_a2_symbol_env.py \
            xgba-anthology-a2-native-release.elf --github-env "$GITHUB_ENV"

      - name: Drive a fresh New Game into the Hub in actual XGBA
        shell: bash
        run: |
          set -euo pipefail
          # Fresh E6 image only. This is a gameplay boot integration gate,
          # not yet a successful in-game save or recovery validation.
          timeout --signal=INT --kill-after=5s 360s \
            build/a2-ci-xgba-runner/mgba-headless \
            --script tools/xgba_a2_runtime_boot.lua \
            build/a2-ci-runtime/a2-boot.gba > /tmp/a2-xgba-game.log 2>&1 || {
              tail -n 120 /tmp/a2-xgba-game.log
              echo "Real game New Game/Hub automation failed."
              exit 1
            }
          tail -n 80 /tmp/a2-xgba-game.log
          grep -q 'A2_XGBA_REAL_NEW_GAME_HUB_PASS' /tmp/a2-xgba-game.log
          python3 tools/xgba_a2_storage.py audit-blank build/a2-ci-runtime/a2-boot.sav

      - name: Save from Hub and audit actual committed native plus PC cohort
        shell: bash
        env:
          A2_ACTION: save
        run: |
          set -euo pipefail
          # This uses only the disposable E6 seed created by the prior step.
          # The Lua sequence sentinel is NOT save evidence; the journal audit
          # is the acceptance check for a real committed native+PC cohort.
          timeout --signal=INT --kill-after=5s 360s \
            build/a2-ci-xgba-runner/mgba-headless \
            --script tools/xgba_a2_runtime_save.lua \
            build/a2-ci-runtime/a2-boot.gba > /tmp/a2-xgba-save.log 2>&1 || {
              tail -n 100 /tmp/a2-xgba-save.log
              exit 1
            }
          tail -n 50 /tmp/a2-xgba-save.log
          grep -q 'A2_XGBA_SAVE_INPUT_SEQUENCE_FINISHED_AUDIT_REQUIRED' /tmp/a2-xgba-save.log
          python3 tools/xgba_a2_storage.py audit build/a2-ci-runtime/a2-boot.sav | tee /tmp/a2-xgba-audit.txt
          grep -q 'counter:' /tmp/a2-xgba-audit.txt
          grep -q 'page_generations:' /tmp/a2-xgba-audit.txt
          # An independent New Game reaches the same Hub: only the actual
          # audited native generation distinguishes Continue from New Game.
          saved_counter=$(sed -n 's/^counter: \([0-9][0-9]*\)$/\1/p' /tmp/a2-xgba-audit.txt)
          if [ -z "$saved_counter" ] || [ "$saved_counter" -eq 0 ]; then
            echo "No positive native save counter to verify on cold restart."
            exit 1
          fi
          echo "A2_EXPECTED_SAVE_COUNTER=$saved_counter" >> "$GITHUB_ENV"

      - name: Cold-restart frozen XGBA and resume saved shared Hub
        shell: bash
        env:
          A2_ACTION: resume
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=5s 360s \
            build/a2-ci-xgba-runner/mgba-headless \
            --script tools/xgba_a2_runtime_save.lua \
            build/a2-ci-runtime/a2-boot.gba > /tmp/a2-xgba-resume.log 2>&1 || {
              tail -n 100 /tmp/a2-xgba-resume.log
              exit 1
            }
          tail -n 50 /tmp/a2-xgba-resume.log
          grep -q 'A2_XGBA_COLD_RESUME_HUB_PASS' /tmp/a2-xgba-resume.log
          python3 tools/xgba_a2_storage.py audit build/a2-ci-runtime/a2-boot.sav

      - name: Delete temporary developer ROM and save regardless of outcome
        if: always()
        run: |
          rm -f build/a2-ci-runtime/a2-layout.gba
          rm -f build/a2-ci-runtime/a2-boot.gba
          rm -f build/a2-ci-runtime/a2-boot.sav
          echo "No ROM or save uploaded. No user files touched."
